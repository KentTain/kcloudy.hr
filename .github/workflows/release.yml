# hr 全合一镜像发布流水线（GitHub Actions 托管 runner；与主仓 platform 侧流水线同构）
#
# 范围：ai-platform-backend-hr 全合一镜像构建推送 + master 滚动（hr-api 单容器双端口 8090/8091）。
# 主仓 platform 侧（worker02/worker01）另线独立承载，两线无依赖冲突。
#
# 触发前提：GitHub 侧 main push——本仓双推惯例（origin Gitee + github 镜像）已保证同步。
#
# 前置配置（一次性）：
# 1. Settings → Environments → 新建 production + Required reviewers（deploy-master 闸门；
#    不配置则合并即上生产，严禁）
# 2. Secrets：
#    GITEE_TOKEN               —— Gitee 私人令牌（projects 读；拉主仓）
#    ALIYUN_REGISTRY_USER/PASS —— RAM 子账号（基础镜像 kcloudy-mirror、项目镜像
#    kcloudy-project 两 namespace 读写）
#    SSH_PRIVATE_KEY           —— master 部署私钥（专用受限账号，勿 root）
#    SSH_USER                  —— SSH 用户名
# 3. known_hosts：首跑经 StrictHostKeyChecking=accept-new TOFU 自动落册。
#
# 产物：ai-platform-backend-hr 双 tag —— vYYYYMMDD.<run_number> + latest；
#       GitHub Release —— vYYYY.MM.DD.<run_number>（变更日志自动汇总）
# 流程：合并 main → 构建推送（自动）→ deploy-master（Environment 审批）→
#       SSH master：publish git pull → .env.node-hr VERSION bump → pull/up hr-api →
#       健康检查（8090 uvicorn + 8091 内嵌 nginx）→ create-release（Release 发布）
# 回滚：master deploy/.env.node-hr 的 VERSION 改回旧 tag 后 up -d hr-api

name: 发布 hr 全合一镜像

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: true

env:
  REGISTRY: registry.cn-zhangjiakou.aliyuncs.com
  IMAGE: registry.cn-zhangjiakou.aliyuncs.com/kcloudy-project/ai-platform-backend-hr
  MAIN_REPO_DIR: main-repo
  MOUNT_DIR: main-repo/server/python/src/modules/hr

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 拉主仓（Gitee @feature/hr-system，production-hr-web 目标所在分支）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 须显式锁定集成分支：Gitee 默认分支 develop 尚无 production-hr-web 目标
          git clone --depth 1 --branch feature/hr-system "https://oauth2:${GITEE_TOKEN}@gitee.com/kenttian/kcloudy.ai-platform.git" "${MAIN_REPO_DIR}"
          # 清除 remote URL 中的 token（workspace 即弃，防御性清理仍保留）
          git -C "${MAIN_REPO_DIR}" remote set-url origin https://gitee.com/kenttian/kcloudy.ai-platform.git

      - name: 子仓内容装配至主仓挂载点（等价 bootstrap.sh rsync 语义，被测代码由子仓 HEAD 锁定）
        run: |
          rm -rf "${MOUNT_DIR}"
          mkdir -p "${MOUNT_DIR}"
          # exclude=main-repo 必须保留：MOUNT_DIR 位于 workspace/main-repo 之内，
          # 左侧 tar 若遍历到它会把右侧刚写出的内容再归档一层，自嵌套直至磁盘填满
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=main-repo --exclude=bootstrap/.work --exclude=.github \
            -cf - . | tar -C "${MOUNT_DIR}" -xf -

      - name: 登录阿里云镜像仓库（基础镜像 FROM 亦在 kcloudy-mirror）
        env:
          ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
          ALIYUN_REGISTRY_PASS: ${{ secrets.ALIYUN_REGISTRY_PASS }}
        run: echo "${ALIYUN_REGISTRY_PASS}" | docker login "$REGISTRY" -u "$ALIYUN_REGISTRY_USER" --password-stdin

      - name: 构建并推送（production-hr-web，DOCKER_BUILDKIT 必须开启）
        id: ver
        run: |
          # TAG 在 shell 内求值：env 块不做命令替换，Actions 只预展开双花括号表达式
          TAG="v$(date +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          export DOCKER_BUILDKIT=1
          docker build \
            --file "${MAIN_REPO_DIR}/server/python/Dockerfile" \
            --target production-hr-web \
            --build-arg BUILD_MODULES=hr,tenant,iam,ai,document \
            --build-arg EXTRA_GROUPS=ai-knowledge,ai-langchain \
            -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" \
            "${MAIN_REPO_DIR}"
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

  deploy-master:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 准备 SSH 私钥
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          echo "${SSH_PRIVATE_KEY}" > ~/deploy_key

      - name: master 滚动（publish 编排同步 + .env.node-hr VERSION bump + pull/up）
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/deploy_key -o StrictHostKeyChecking=accept-new "${SSH_USER}@121.89.220.143" \
            "cd /mnt/docker-images/kcloudy.publish \
             && git pull --ff-only \
             && sed -i 's/^VERSION=.*/VERSION=${TAG}/' deploy/.env.node-hr \
             && docker compose -f deploy/docker-compose.node-hr.yml --env-file deploy/.env.node-hr pull hr-api \
             && docker compose -f deploy/docker-compose.node-hr.yml --env-file deploy/.env.node-hr up -d hr-api"

      - name: 健康检查（uvicorn :8090 + 内嵌 nginx :8091，master 内网 curl）
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ok=0
          for i in $(seq 1 36); do
            if ssh -i ~/deploy_key -o StrictHostKeyChecking=accept-new "${SSH_USER}@121.89.220.143" \
              'curl -sf http://172.23.160.12:8090/health >/dev/null && curl -sf http://172.23.160.12:8091/ >/dev/null'; then
              ok=1; break
            fi
            sleep 5
          done
          rm -f ~/deploy_key
          [ "$ok" = 1 ] || { echo "健康检查超时（3 分钟），SSH 上 master 查 docker logs ai-platform-backend-hr"; exit 1; }
          echo "master hr-api 滚动完成：${{ needs.build-push.outputs.tag }}（8090/8091 双检通过）"

  create-release:
    needs: [build-push, deploy-master]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 创建 GitHub Release（tag vYYYY.MM.DD.<run_number>，中文说明）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          # TAG 在 shell 内求值：env 块不做命令替换（同 build-push 教训）
          TAG="v$(date +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在（上次运行已创建），跳过"
            exit 0
          fi
          # 上一 Release → 本 tag 的提交清单（无上一 Release 时省略清单与对比链接）
          PREV=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName' || true)
          {
            echo "## 本版本镜像"
            echo "- \`registry.cn-zhangjiakou.aliyuncs.com/kcloudy-project/ai-platform-backend-hr:${IMAGE_TAG}\`"
            echo ""
            echo "## 提交清单"
            if [ -n "${PREV}" ]; then
              # compare 用 GITHUB_SHA：Release tag 在 body 构建时尚未创建，用 tag 名会 404
              gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_SHA}" \
                --jq '.commits[] | "- " + (.sha[0:8] + " " + (.commit.message | split("\n")[0]))' || true
              echo ""
              echo "**完整对比**: [${PREV}...${TAG}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG})"
            fi
          } > body.md
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}（镜像 ${IMAGE_TAG}）" \
            --notes-file body.md
